
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Demo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>DevOps Demo App</h1>
        <p>Application Development and Deployment Architecture</p>
    </header>

    <main class="container">
        <h2>Welcome!</h2>
        <p>This application demonstrates a basic CI/CD workflow.</p>

        <div class="tools">
            <div class="tool">GitHub</div>
            <div class="tool">Jenkins</div>
            <div class="tool">Docker</div>
        </div>

        <button onclick="showMessage()">Test Application</button>
        <p id="message"></p>
    </main>

    <footer>
        <p>Lab 5 | CI/CD and Container Deployment</p>
    </footer>

    <script>
        function showMessage() {
            document.getElementById("message").textContent =
                "Application is working successfully!";
        }
    </script>
</body>
</html>
